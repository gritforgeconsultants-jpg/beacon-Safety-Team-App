{% extends "base.html" %}
{% block title %}Level Locked - beacon Safety{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 2rem auto; text-align:center;">
    <div class="card" style="padding:2.5rem 1.5rem;">
        <div style="width:80px; height:80px; border-radius:50%; background:#f3f4f6; display:inline-flex; align-items:center; justify-content:center; margin-bottom:1rem;">
            <span style="font-size:2.5rem;">&#128274;</span>
        </div>
        <h1>Level Locked</h1>
        <p class="text-secondary mt-1">Complete all scenarios in previous levels to unlock <strong>{{ level.name }}</strong>.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary mt-2">Back to Dashboard</a>
    </div>
</div>
{% endblock %}
