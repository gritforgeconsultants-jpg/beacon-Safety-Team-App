{% extends "base.html" %}
{% block title %}Log In - beacon Safety{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 2rem auto;">
    <div style="text-align:center; margin-bottom:1.5rem;">
        <div style="font-size:2rem; font-weight:900; letter-spacing:-0.02em; text-transform:lowercase;">
            <span style="background:var(--beacon-blue); color:white; padding:0.1em 0.4em; border-radius:6px;">beacon</span>
        </div>
        <p class="text-secondary mt-1" style="font-weight:600;">Safety Team Training</p>
    </div>
    <div class="card">
        <h2>Log In</h2>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger">Invalid username or password.</div>
            {% endif %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>
        <p class="text-muted mt-2" style="text-align:center;">
            No account? <a href="{% url 'register' %}" style="color:var(--beacon-blue); font-weight:700;">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
